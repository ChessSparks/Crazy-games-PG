<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Planets Game</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070f; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; background: #05070f; outline: none; display: block; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(320px, 70vw); text-align: center;
                 font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #9fd8ff; letter-spacing: 3px; }
      #bar { margin-top: 12px; height: 4px; border-radius: 2px; background: rgba(159, 216, 255, 0.15); overflow: hidden; }
      #fill { height: 100%; width: 0; background: #7ef6ff; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">LOADING<div id="bar"><div id="fill"></div></div></div>
    <script src="Build/bgpg.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/bgpg.data.unityweb",
        frameworkUrl: "Build/bgpg.framework.js.unityweb",
        codeUrl: "Build/bgpg.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SparksDevelopmentStudio",
        productName: "Planets Game",
        productVersion: "0.1.0",
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function (instance) {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
